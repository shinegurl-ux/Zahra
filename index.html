<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Zahra</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =================================================
         اللعبة
         ================================================= -->

    <main id="game">

        <!-- الخلفية -->
        <div id="background"></div>


        <!-- =================================================
             شخصية زهرة
             الصور موجودة في نفس مجلد index.html
             ================================================= -->

        <img
            id="character"
            src="normal_zahra.png"
            alt="زهرة"
        >


        <!-- =================================================
             مربع الحوار
             ================================================= -->

        <section id="dialogue-box">

            <!-- اسم المتحدث -->
            <div id="name-box">
                زهرة
            </div>

            <!-- الكلام -->
            <div id="dialogue"></div>

            <!-- سهم الاستمرار -->
            <div id="continue">
                ▼
            </div>

        </section>


        <!-- =================================================
             الاختيارات
             ================================================= -->

        <section id="choices"></section>

    </main>


    <!-- =================================================
         كود اللعبة
         ================================================= -->

    <script src="game.js"></script>

</body>

</html>
